name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build isolated workflow compiler
        run: node scripts/build-workflow.mjs

      - name: Compile Fusion with ZCode (no model calls)
        run: node workflow/host/fusion-compile-selfcheck.mjs

      - name: Validate source and committed bundles
        run: pnpm run selfcheck

      - name: Verify build and package layout
        run: |
          pnpm run build
          pnpm pack --dry-run
